# SUPERSEDED HISTORICAL TEMPLATE. Do not apply; use blueprint.staging-neon-free.yaml.
# Earlier free Render-database comparison: API and temporary PostgreSQL 18 only.
# No free Render background-worker plan exists; email workflows remain blocked.
# Render internal PostgreSQL TLS cannot satisfy the current verify-full profile.
# Free PostgreSQL expires after 30 days and has no managed backups/PITR.
services:
  - type: web
    name: blacklist-staging-api
    runtime: node
    region: frankfurt
    plan: free
    branch: chore/render-staging-deployment
    autoDeployTrigger: 'off'
    buildCommand: node infrastructure/render/build.mjs api
    startCommand: node infrastructure/render/run.mjs api
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_RP_NAME
        value: Blacklist Staging
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: STAGING_ACCESS_TOKEN
        sync: false
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      - key: BREAK_GLASS_ENABLED
        value: 'false'
databases:
  - name: blacklist-staging-db
    region: frankfurt
    plan: free
    postgresMajorVersion: '18'
    databaseName: blacklist_staging
    user: blacklist_provisioner
    diskSizeGB: 1
    ipAllowList: []
